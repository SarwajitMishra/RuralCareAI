services:

  # Local LLM runtime. Pulls gemma3:1b into a persistent volume on
  # first start (~815MB, one-time), then serves it on the internal
  # network only - not exposed to the host.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 3
        ollama pull gemma3:1b
        wait
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # RuralCare AI application (Streamlit).
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=ollama:11434
    volumes:
      - app_data:/app/data
      - app_reports:/app/reports
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_models:
  app_data:
  app_reports:
  app_uploads:
  app_logs:
